<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Flashlight/Battery Torch body -->
  <polygon points="20,40 38,32 38,68 20,60" fill="#eab308" stroke="#0f172a" stroke-width="3"/>
  <rect x="38" y="38" width="44" height="24" rx="3" fill="#dc2626" stroke="#0f172a" stroke-width="3"/>
  <!-- Switch -->
  <rect x="52" y="32" width="12" height="6" rx="2" fill="#0f172a"/>
  <!-- Light rays -->
  <line x1="16" y1="36" x2="6" y2="30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="4" y2="50" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <line x1="16" y1="64" x2="6" y2="70" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  <text x="50" y="96" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle" fill="#64748b">BATTERY TORCH (KRS)</text>
</svg>
